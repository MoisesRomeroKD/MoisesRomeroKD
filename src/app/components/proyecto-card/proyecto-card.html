<div *ngIf="proyecto" class="card-detalle">

  <h2>{{ proyecto.titulo }}</h2>

  <p class="resumen">{{ proyecto.resumen }}</p>

  <div class="descripcion">
    <p>{{ proyecto.descripcion }}</p>
  </div>

<div [innerHTML]="proyecto.detalle"></div>

  <div class="tech">
    <strong>Tecnologías:</strong>
    <ul>
      <li *ngFor="let tech of proyecto.tecnologias">
        {{ tech }}
      </li>
    </ul>
  </div>

  <a *ngIf="proyecto.enlace"
     [href]="proyecto.enlace"
     target="_blank">
    Ver proyecto en vivo
  </a>

</div>
